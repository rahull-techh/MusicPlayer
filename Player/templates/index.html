<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Dhun — Interactive Music Player{% endblock %}</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- MediaElement.js CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/mediaelement/4.2.16/mediaelementplayer.min.css">

    {% load static %}
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body class="selection:bg-amber-500 selection:text-black relative overflow-x-hidden min-h-screen flex flex-col justify-between">

    <!-- Interactive Live Cursor-Reactive Background Canvas -->
    <canvas id="bgCanvas" class="fixed inset-0 pointer-events-none z-0"></canvas>

    <!-- Global Header -->
    <header class="w-full max-w-3xl mx-auto px-6 py-8 flex justify-between items-center border-b border-white/10 relative z-10">
        <div>
            <a href="{% url 'song_list' %}" class="font-serif-custom text-4xl tracking-wide accent-gold hover:opacity-80 transition-opacity">DHUN</a>
            <p class="text-xs text-gray-400 tracking-widest uppercase">Aesthetic Melodies</p>
        </div>
        <div class="text-sm text-gray-400 font-mono bg-white/5 px-3 py-1.5 rounded-full border border-white/5">
            {% block header_info %}{% endblock %}
        </div>
    </header>

    <!-- Main Dynamic Content Block -->
    <main class="w-full max-w-3xl mx-auto px-6 py-8 flex-grow space-y-6 relative z-10">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Global Footer -->
    <footer class="w-full text-center py-6 text-xs text-gray-500 border-t border-white/5 mt-10 relative z-10">
        <p>Crafted with warmth & rhythm · By Rahul</p>
    </footer>

    <!-- jQuery & MediaElement.js -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mediaelement/4.2.16/mediaelement-and-player.min.js"></script>
    <script src="{% static 'script.js' %}"></script>

    <!-- Cursor-Reactive Animated Background Engine -->
    <script>
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let particles = [];
        let mouse = { x: null, y: null, radius: 150 };

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        window.addEventListener('mouseout', () => {
            mouse.x = null;
            mouse.y = null;
        });

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 2.5 + 1;
                this.baseX = this.x;
                this.baseY = this.y;
                this.density = (Math.random() * 20) + 5;
                this.vx = Math.random() * 0.4 - 0.2;
                this.vy = Math.random() * 0.4 - 0.2;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;

                // Screen boundaries bounce
                if (this.x < 0 || this.x > width) this.vx = -this.vx;
                if (this.y < 0 || this.y > height) this.vy = -this.vy;

                // Cursor interaction reaction
                if (mouse.x !== null && mouse.y !== null) {
                    let dx = mouse.x - this.x;
                    let dy = mouse.y - this.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance < mouse.radius) {
                        let force = (mouse.radius - distance) / mouse.radius;
                        let angle = Math.atan2(dy, dx);
                        this.x -= Math.cos(angle) * force * 3;
                        this.y -= Math.sin(angle) * force * 3;
                    }
                }
            }
            draw() {
                ctx.fillStyle = 'rgba(242, 179, 27, 0.35)'; // Gold accent tone
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.closePath();
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            let numberOfParticles = (width * height) / 12000;
            for (let i = 0; i < numberOfParticles; i++) {
                particles.push(new Particle());
            }
        }
        initParticles();

        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            // Rich dark gradient background matching your theme
            let gradient = ctx.createLinearGradient(0, 0, width, height);
            gradient.addColorStop(0, '#0a0d14');
            gradient.addColorStop(0.5, '#121824');
            gradient.addColorStop(1, '#1a1025');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);

            // Update and draw particles
            particles.forEach(p => {
                p.update();
                p.draw();
            });

            // Draw connecting lines for nearby particles
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    let dx = particles[i].x - particles[j].x;
                    let dy = particles[i].y - particles[j].y;
                    let dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 100) {
                        ctx.strokeStyle = `rgba(242, 179, 27, ${0.08 * (1 - dist / 100)})`;
                        ctx.lineWidth = 0.5;
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
